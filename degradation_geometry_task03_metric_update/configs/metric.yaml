# Task 3 supplements the existing default.yaml and prepared Task 0 manifests.
output_dir: outputs/task03
device: cpu
torch_threads: 4
noise_seed: 314159
noise_realizations: 4
plots: true
pilot:
  max_train_images: 4
  max_valid_images: 2
  crops_per_image: 1
# Cartesian products, in the parameter order of the Task 2 registry.
# Start with these four families. Other verified families can be enabled below.
grids:
  affine_intensity:
    axes: {a: [0.5, 1.0, 1.5], b: [-0.1, 0.0, 0.1]}
  gaussian_noise:
    axes: {sigma_noise: [0.0, 0.05, 0.1, 0.2]}
  isotropic_blur:
    axes: {sigma: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0, 3.5]}
  anisotropic_fixed_theta:
    axes:
      sigma_x: [0.5, 1.0, 2.0, 3.0, 3.5]
      sigma_y: [0.5, 1.0, 2.0, 3.0, 3.5]
# Optional entries use either axes or explicit points, never both. Examples:
#  anisotropic_blur:
#    points: [[3.5, 0.5, 0.0], [3.5, 0.5, 0.63], [2.0, 2.0, 0.47], [2.002, 2.0, 0.47]]
#  haze_unit_depth:
#    axes: {beta: [0.0, 0.5, 1.3], A: [0.5, 0.9]}
#  haze_toy_depth:
#    axes: {beta: [0.0, 0.5, 1.3], A: [0.5, 0.9]}
#  blur_then_noise:
#    axes: {sigma_blur: [0.5, 2.0, 3.5], sigma_noise: [0.0, 0.05, 0.1]}
#  noise_then_blur:
#    axes: {sigma_blur: [0.5, 2.0, 3.5], sigma_noise: [0.0, 0.05, 0.1]}
#  blur_then_haze:
#    points: [[0.5, 0.0, 0.9], [2.0, 0.5, 0.9], [3.5, 1.3, 0.5]]
#  haze_then_blur:
#    points: [[0.5, 0.0, 0.9], [2.0, 0.5, 0.9], [3.5, 1.3, 0.5]]
diagnostics:
  # A numerical reporting convention, not an intrinsic-dimension estimator.
  rank_atol: 1.0e-12
  rank_rtol: 1.0e-8
  psd_atol: 1.0e-14
  psd_rtol: 1.0e-10
